<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1920 1080">

<defs>

<linearGradient
id="purple"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#7B4CFF"/>

<stop offset="100%" stop-color="#00C7FF"/>

</linearGradient>

<filter id="blur">

<feGaussianBlur stdDeviation="35"/>

</filter>

</defs>

<!-- Glow -->

<circle
cx="150"
cy="120"
r="170"
fill="#7B4CFF"
opacity=".28"
filter="url(#blur)"/>

<circle
cx="1700"
cy="900"
r="220"
fill="#00C7FF"
opacity=".22"
filter="url(#blur)"/>

<!-- Curves -->

<path
d="M-100 100
C450 250
850 -100
1500 180"

stroke="url(#purple)"
stroke-width="2"

fill="none"

opacity=".18"/>

<path
d="M300 1050
C700 700
1200 1250
1900 800"

stroke="url(#purple)"
stroke-width="2"

fill="none"

opacity=".14"/>

<!-- Small dots -->

<circle cx="420" cy="250" r="3" fill="#7B4CFF"/>

<circle cx="1450" cy="180" r="2.5" fill="#00C7FF"/>

<circle cx="1700" cy="520" r="3" fill="#7B4CFF"/>

<circle cx="650" cy="840" r="2.5" fill="#00C7FF"/>

</svg>